services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nn-sample-messaging-api
    container_name: nn-sample-messaging-api
    env_file:
      - .env
    ports:
      - "8085:8085"
    volumes:
      - ./app:/app  # Make sure this maps to your actual app directory
      - ./models:/app/models  # Optional: if you want to persist downloaded models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G  # Increased memory for GPU workloads
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - USE_GPU=1  # Enable GPU usage
      - FORCE_CPU=0  # Ensure CPU is not forced
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0  # Specify GPU device
    # Note: runtime: nvidia is deprecated, use deploy.resources.reservations instead