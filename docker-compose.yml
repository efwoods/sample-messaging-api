# docker-compose.yml
services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN} # Pass from .env file
    image: nn-sample-messaging-api-${USE_GPU:-cpu}
    container_name: nn-sample-messaging-api
    env_file:
      - .env # Load local .env file
    environment:
      # GPU configuration - dynamically set based on USE_GPU flag
      - CUDA_VISIBLE_DEVICES=${USE_GPU:-}${USE_GPU:+"0"}${USE_GPU:-""}
      - FORCE_CPU=${USE_GPU:-1}${USE_GPU:+0}
      - USE_GPU=${USE_GPU:-0}
      - UVICORN_RELOAD=1
    ports:
      - "8085:8085"
    volumes:
      # Mount app directory for hot reloading, but EXCLUDE the models directory
      - ./app:/app:delegated
      # Create a named volume for models to persist the downloaded model
      - model_cache:/app/models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: ${USE_GPU:-4G}${USE_GPU:+8G}
        reservations:
          devices:
            - driver: nvidia
              count: ${USE_GPU:-0}${USE_GPU:+1}
              capabilities: [gpu]
    # Only add runtime when using GPU
    runtime: ${USE_GPU:-}${USE_GPU:+nvidia}

volumes:
  model_cache:
    driver: local